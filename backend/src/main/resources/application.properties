spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/land_marketplace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
server.port=${SERVER_PORT:8081}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Development defaults. Any shared or production environment must override JWT_SECRET
# (HS256 needs at least 32 characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-outside-local-development}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
