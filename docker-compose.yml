services:
  db:
    image: postgis/postgis:16-3.4
    container_name: land-marketplace-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-land_marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-land_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: